<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1500px;background:#f4f3ef;font-family:'IBM Plex Mono',monospace;padding:40px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid #101010;border-left:1px solid #cfcec7}
.c{border-right:1px solid #cfcec7;border-bottom:1px solid #cfcec7;padding:26px;text-align:center}
.c img{width:300px;height:300px;object-fit:contain;display:block;margin:0 auto}
.n{font-size:12px;letter-spacing:.13em;color:#6e6d66;text-transform:uppercase;text-align:left;margin-bottom:18px}
.t{font-size:15px;color:#101010;margin-top:18px;letter-spacing:.02em}
</style></head><body>
<div class="g">
<div class="c"><div class="n">Concept 01</div><img src="concept-1.svg"><div class="t">Registration mark</div></div>
<div class="c"><div class="n">Concept 02</div><img src="concept-2.svg"><div class="t">The flatline</div></div>
<div class="c"><div class="n">Concept 03</div><img src="concept-3.svg"><div class="t">Order from disorder</div></div>
<div class="c"><div class="n">Concept 04</div><img src="concept-4.svg"><div class="t">Notched square</div></div>
<div class="c"><div class="n">Concept 05</div><img src="concept-5.svg"><div class="t">Chip footprint</div></div>
<div class="c"><div class="n">Concept 06</div><img src="concept-6.svg"><div class="t">Tolerance target</div></div>
</div></body></html>
